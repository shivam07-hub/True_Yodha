name: Upskilling Production Smoke

on:
  push:
    branches:
      - main
    paths:
      - "backend/app/services/upskilling_service.py"
      - "backend/app/routers/upskilling.py"
      - "backend/app/schemas/upskilling.py"
      - "backend/scripts/smoke_upskilling.py"
      - "database/migrations/**"
      - "frontend/components/skills/upskilling/**"
      - ".github/workflows/upskilling-production-smoke.yml"
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install smoke dependency
        run: python -m pip install httpx==0.27.0

      - name: Verify deployed upskilling flow
        working-directory: backend
        env:
          MYRO_API_BASE_URL: https://api.himyro.com
          MYRO_EXPECTED_VERSION: ${{ github.sha }}
          MYRO_SMOKE_EMAIL: ${{ secrets.MYRO_SMOKE_EMAIL }}
          MYRO_SMOKE_PASSWORD: ${{ secrets.MYRO_SMOKE_PASSWORD }}
        run: |
          export MYRO_EXPECTED_VERSION="${MYRO_EXPECTED_VERSION:0:7}"
          python -m scripts.smoke_upskilling
