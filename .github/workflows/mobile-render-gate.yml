name: Mobile render gate

# The check that LOOKS at the app.
#
# For months every automated check was green while the mobile app shipped
# near-black headings on a near-black page, three nav tabs clipped off the right
# edge of every public route, and 15x15px checkboxes on the skill-confirmation
# screen. tsc reads types, eslint reads syntax, ui-drift-guard reads file
# contents. None of them render anything, so none of them could see any of it.
#
# This job renders the real app in a real authed session at 375px, in both
# themes, and asserts: contrast, starved columns, unreachable controls and
# panels, canvas-vs-theme agreement, and WCAG 2.2 pointer targets.
#
# It is a separate workflow from Frontend CI on purpose: it needs a browser, a
# running server and credentials, so it is slower and has a failure mode of its
# own. Keeping it apart means a flaky login cannot block a typecheck.
#
# It signs in against REAL infrastructure — dev and prod share one database
# (INFRA.md) — so it stays strictly read-only: it navigates and measures, and
# it never submits a form. Anything added here that writes, writes to
# production.

on:
  push:
    branches: [Develop, main]
    paths:
      - 'frontend/**'
      - 'scripts/qa-mobile-capture.py'
      - '.github/workflows/mobile-render-gate.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'scripts/qa-mobile-capture.py'
      - '.github/workflows/mobile-render-gate.yml'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # Say the reason out loud rather than passing an empty check. A gate that
      # silently no-ops when its credentials are missing is the "red check with
      # no owner" failure in a nicer costume.
      - name: Are the QA credentials configured?
        id: creds
        env:
          QA_EMAIL: ${{ secrets.MYRO_SMOKE_EMAIL }}
          QA_PASSWORD: ${{ secrets.MYRO_SMOKE_PASSWORD }}
          QA_API: ${{ secrets.MYRO_SMOKE_API_URL }}
        run: |
          if [ -z "$QA_EMAIL" ] || [ -z "$QA_PASSWORD" ] || [ -z "$QA_API" ]; then
            echo "have=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Mobile render gate skipped::Set the repo secrets MYRO_SMOKE_EMAIL, MYRO_SMOKE_PASSWORD and MYRO_SMOKE_API_URL (a dedicated seeded QA account, never a real user) to turn this gate on."
          else
            echo "have=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.have == 'true'
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        if: steps.creds.outputs.have == 'true'
        with:
          python-version: '3.11'

      - name: Install Playwright + Chromium
        if: steps.creds.outputs.have == 'true'
        run: |
          python -m pip install playwright==1.47.0
          python -m playwright install --with-deps chromium

      # The gate reads credentials from frontend/.env.local and nowhere else, so
      # the runner gets one. It is gitignored, and the values never reach the
      # log — the script prints the API host and nothing else.
      - name: Write frontend/.env.local
        if: steps.creds.outputs.have == 'true'
        env:
          QA_EMAIL: ${{ secrets.MYRO_SMOKE_EMAIL }}
          QA_PASSWORD: ${{ secrets.MYRO_SMOKE_PASSWORD }}
          QA_API: ${{ secrets.MYRO_SMOKE_API_URL }}
        run: |
          {
            printf 'NEXT_PUBLIC_API_URL=%s\n' "$QA_API"
            printf 'MYRO_TEST_EMAIL=%s\n' "$QA_EMAIL"
            printf 'MYRO_TEST_PASSWORD=%s\n' "$QA_PASSWORD"
          } > frontend/.env.local

      - name: Install dependencies
        if: steps.creds.outputs.have == 'true'
        run: cd frontend && npm ci

      # A production server, not `next dev`: the gate is about what ships, and
      # a dev server's on-demand compilation turns every first visit to a route
      # into a timeout risk on a cold runner.
      - name: Build
        if: steps.creds.outputs.have == 'true'
        run: cd frontend && npm run build

      - name: Start the server
        if: steps.creds.outputs.have == 'true'
        run: |
          cd frontend && npm run start &
          for i in $(seq 1 60); do
            if curl -sfo /dev/null http://localhost:3000/login; then
              echo "server up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "server never answered on :3000"
          exit 1

      - name: Render gate
        if: steps.creds.outputs.have == 'true'
        run: python scripts/qa-mobile-capture.py --base-url http://localhost:3000

      # Failures name the selector and the measurement, but a screenshot is how
      # you see what it looked like. Only on failure — 40 PNGs per green run is
      # storage nobody reads.
      - name: Upload screenshots
        if: failure() && steps.creds.outputs.have == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mobile-render-375px
          path: frontend/.qa-shots
          retention-days: 7
