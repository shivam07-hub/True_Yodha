name: Notice closer

# Daily operator loop (ADR-0021). Records live in Postgres; this job harvests
# Railway deaths, settles proofs already on origin/main, and sends one digest.
# Cursor authors the close. Does not run on Railway. Does not call OpenRouter.

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

concurrency:
  group: notice-closer
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Railway CLI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -n "$RAILWAY_TOKEN" ]; then npm install -g @railway/cli; fi
        working-directory: .

      - name: Notice closer
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPS_ALERT_EMAIL: ${{ secrets.OPS_ALERT_EMAIL }}
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: a15c0013-3f6b-4a75-9b7a-4cd6d93c80c7
          RAILWAY_ENVIRONMENT_ID: 9e77c93e-9f0f-4c29-ac4e-e9c4d39ae6c5
          MYRO_ENV: prod
        run: python -m app.notice.closer
