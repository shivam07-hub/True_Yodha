  <desc id="desc">Myro newsletter image: Bengaluru builds, Hyderabad ships, Mumbai banks, Delhi sells AI — active postings by metro in the second week of July 2026.</desc>
  <rect width="1200" height="630" fill="#fbfaf7"/>
