<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Consulting and BFSI out-hire technology five to one in India, July 2026</title>
  <desc id="desc">Myro newsletter image: consulting 10,110 and BFSI 8,299 active postings versus technology 3,630 in the second week of July 2026.</desc>
  <rect width="1200" height="630" fill="#fbfaf7"/>
  <rect x="52" y="50" width="1096" height="530" rx="28" fill="#ffffff" stroke="#e7e0d4" stroke-width="2"/>
  <rect x="52" y="50" width="1096" height="120" rx="28" fill="#0f172a"/>
  <rect x="52" y="132" width="1096" height="38" fill="#0f172a"/>
  <text x="92" y="112" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="700">Myro &#183; Hiring Heatmap</text>
  <text x="92" y="148" fill="#fbbf24" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600">Industry report &#183; July 2026</text>

  <text x="92" y="238" fill="#111827" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="800">Two industries out-hire tech 5&#215;</text>
  <text x="92" y="290" fill="#374151" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="600">Neither is the one you&#8217;re watching</text>

