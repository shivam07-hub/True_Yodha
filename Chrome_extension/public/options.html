<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Myro Settings</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="options-body">
    <main class="settings-shell">
      <div class="topbar-title">
        <img src="icons/icon-32.png" alt="" class="brand-mark" width="20" height="20" />
        <div class="eyebrow">Myro</div>
      </div>
      <h1>Extension settings</h1>
      <form id="settings-form" class="settings-form">
        <label>
          API URL
          <input id="api-url" type="url" placeholder="http://localhost:8000" />
        </label>
        <label>
          Access token
          <textarea id="token" rows="5" placeholder="Paste your Myro access token"></textarea>
        </label>
        <button type="submit" class="button primary">Save settings</button>
      </form>
      <p id="status-text" class="body-copy"></p>
      <footer class="popup-footer" style="margin-top: 24px;">
        <a href="https://himyro.com/privacy" target="_blank" rel="noreferrer" class="footer-link">Privacy Policy</a>
      </footer>
    </main>
    <script type="module" src="src/options.js"></script>
  </body>
</html>
